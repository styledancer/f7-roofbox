<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лиды конфигуратора</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:">
<style>
/* Layout: icon rail | company list | working card. Desk tool: calm neutrals with a green accent, status colours carry meaning. */
:root{
  --bg:#F2F4F3; --panel:#FFFFFF; --sunk:#E9EDEB; --ink:#17201C; --muted:#5F6C67; --line:#D9E0DD;
  --accent:#0E7A5F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8; --warn:#B45309; --bad:#B91C1C; --good:#15803D;
  --f:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --fm:"Cascadia Mono","Consolas",ui-monospace,monospace;
  --s-new:#64748B; --s-research:#0369A1; --s-contacted:#7C3AED; --s-replied:#0891B2; --s-meeting:#0E7A5F; --s-proposal:#CA8A04; --s-negotiation:#EA580C; --s-won:#15803D; --s-lost:#9CA3AF;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#101614; --panel:#18211E; --sunk:#131B18; --ink:#E4ECE9; --muted:#93A29C; --line:#28332F;
  --accent:#3FBF97; --accent-ink:#06120E; --accent-soft:#17372D; --warn:#F59E0B; --bad:#F87171; --good:#4ADE80; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f);display:grid;grid-template-columns:64px 340px 1fr;grid-template-rows:100vh;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* rail */
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;margin-bottom:10px}
.rail button{width:48px;height:48px;border-radius:12px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;gap:2px;font-size:10px}
.rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.rail .sp{flex:1}

/* list */
.list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;background:var(--sunk)}
.lhead{padding:12px 12px 8px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border-bottom:1px solid var(--line);min-width:0}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.frow{display:flex;gap:6px}
.frow select{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lmeta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.add{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:4px 10px;font-weight:600}
.items{overflow:auto;flex:1;padding:6px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:9px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;width:100%;text-align:left;background:transparent}
.it:hover{background:var(--panel)}
.it[aria-selected="true"]{background:var(--panel);border-color:var(--line);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sub{grid-column:1/2;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .due{font:600 11px var(--fm);color:var(--muted);align-self:center}
.it .due.over{color:var(--bad)} .it .due.today{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.pr{font:700 10px var(--fm);letter-spacing:.06em;color:var(--muted)}
.pr.h{color:var(--warn)}

/* main */
.main{overflow:auto;min-width:0;height:100vh}
.view{padding:22px 28px 60px;max-width:1080px;display:grid;gap:18px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:650;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ch .meta{color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.link{color:var(--accent);background:none;border:0;padding:0;font:500 13px var(--fm);text-decoration:underline;text-underline-offset:2px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:9px 14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:14px;color:var(--ink);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
label.f textarea{min-height:92px;resize:vertical;line-height:1.5}
.hint{font-size:12px;color:var(--muted);font-weight:400}

/* status stepper */
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.steps button::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);opacity:.5}
.steps button.done{color:var(--ink)} .steps button.done::before{opacity:1}
.steps button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.steps button[aria-pressed="true"]::before{background:#fff;opacity:1}
.next{display:grid;grid-template-columns:1fr 170px;gap:10px;align-items:end}

/* notes */
.nadd{display:grid;gap:8px}
.nadd textarea{min-height:70px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.nrow{display:flex;justify-content:space-between;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.notes{display:grid;gap:10px}
.note{border-left:3px solid var(--line);padding:2px 0 2px 12px}
.note .t{font:600 11px var(--fm);color:var(--muted);display:flex;gap:10px;align-items:center}
.note .t button{border:0;background:none;color:var(--muted);font-size:11px;padding:0}
.note p{margin:3px 0 0;white-space:pre-wrap}
.note.sys{border-left-color:var(--accent)} .note.sys p{color:var(--muted)}

/* kp */
.kpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpbar select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.kp{width:100%;min-height:560px;padding:18px 20px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font:400 14.5px/1.6 var(--f);resize:vertical}
.flag{font-size:12px;color:var(--warn)}

/* strategy */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:650 26px/1.1 var(--f);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.funnel{display:grid;gap:6px}
.frow2{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar{height:14px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.frow2 .v{font:600 12px var(--fm);text-align:right;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums}
.tips{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.tips li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);display:flex;gap:10px;align-items:flex-start}
.tips li b{font-weight:600}
.tips .go{margin-left:auto;white-space:nowrap}
.duel{display:grid;gap:4px}
.duel button{display:flex;justify-content:space-between;gap:10px;border:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left}
.empty{color:var(--muted);padding:30px;text-align:center}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1180px){ body{grid-template-columns:64px 290px 1fr} .grid3{grid-template-columns:1fr 1fr} .kpi{grid-template-columns:1fr 1fr} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<nav class="rail" aria-label="Разделы">
  <div class="logo" aria-hidden="true">3D</div>
  <button id="nav-leads" data-nav="leads" aria-current="page" title="Компании"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Лиды</button>
  <button id="nav-strategy" data-nav="strategy" title="Стратегия"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>План</button>
  <span class="sp"></span>
  <button id="nav-settings" data-nav="settings" title="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Я</button>
</nav>

<aside class="list" aria-label="Список компаний">
  <div class="lhead">
    <input class="search" id="q" type="search" placeholder="Поиск: название, город, заметки">
    <div class="frow">
      <select id="fSeg" aria-label="Ниша"></select>
      <select id="fSt" aria-label="Статус"></select>
    </div>
    <div class="frow">
      <select id="fSort" aria-label="Сортировка">
        <option value="next">Сначала ближайший шаг</option>
        <option value="prio">По приоритету</option>
        <option value="name">По названию</option>
        <option value="recent">Недавно изменённые</option>
      </select>
    </div>
    <div class="lmeta"><span id="lcount"></span><button class="add" id="addBtn">+ Компания</button></div>
  </div>
  <div class="items" id="items" role="listbox" aria-label="Компании"></div>
</aside>

<main class="main" id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script src="seed.js"></script>
<script>
/* ---------- dictionaries ---------- */
const SEG={box:'Автобоксы',tent:'Автопалатки',x4:'Экспедиционный тюнинг',kung:'Кунги и модули на пикап',trailer:'Прицепы-дачи и кемперы',rv:'Автодома',cargo:'Прицепы и лодки',other:'Другое'};
const ST=[['new','Новый'],['research','Изучаю'],['contacted','Написал'],['replied','Ответили'],['meeting','Встреча'],['proposal','КП отправлено'],['negotiation','Переговоры'],['won','Сделка'],['lost','Отказ']];
const STN=Object.fromEntries(ST); const STI=Object.fromEntries(ST.map(([k],i)=>[k,i]));
const ACTIVE=new Set(['research','contacted','replied','meeting','proposal','negotiation']);
const PR={h:'Высокий',m:'Средний',l:'Низкий'};
// what the configurator shows for each niche: the buyer's side and the seller's side
const PITCH={
  box:{noun:'автобоксов',buyer:['ставит бокс на свою машину в 3D и сразу видит, как он выглядит сбоку, сзади и сверху','проверяет, не упрётся ли открытая дверь багажника в бокс','видит общую высоту с боксом и проходит ли машина во въезд паркинга','укладывает свои вещи внутрь и понимает, хватит ли объёма','сравнивает две модели рядом'],
       seller:['меньше возвратов из-за «не подошёл к машине» или «не влезла лыжа»','продавец в магазине или у дилера показывает всю линейку без образцов на складе','покупатель выбирает модель дороже, когда видит разницу в объёме наглядно']},
  tent:{noun:'автопалаток',buyer:['ставит палатку на крышу своей машины и раскрывает её в 3D','видит общую высоту в сложенном виде и проходит ли машина во въезд паркинга','понимает, сколько места занимает раскрытая палатка и где лестница','сравнивает две модели рядом'],
       seller:['снимает главный страх покупки: «подойдёт ли на мою машину и пройду ли в гараж»','палатку можно показать раскрытой на любой машине, без выездной демонстрации','отдельный аргумент на выставках и у дилеров']},
  x4:{noun:'экспедиционного оборудования',buyer:['ставит багажник или бампер на свою модель внедорожника','видит общую высоту с грузом на крыше и проходит ли машина во въезд паркинга','собирает комплект: багажник, лестница, свет, канистры'],
       seller:['меньше вопросов «а на мою встанет?» в мессенджерах','комплект продаётся целиком, а не по одной позиции','наглядная разница между версиями для разных машин']},
  kung:{noun:'кунгов и жилых модулей',buyer:['ставит кунг или модуль на свой пикап','видит общую высоту и проходит ли машина во въезд паркинга','открывает двери и окна, заглядывает внутрь','выбирает опции и видит их сразу'],
       seller:['покупатель приходит с готовой конфигурацией, а не с вопросами','меньше времени менеджера на подбор','заявка сразу содержит модель пикапа и выбранные опции']},
  trailer:{noun:'прицепов-дач',buyer:['цепляет прицеп к своей машине в 3D и видит всю сцепку','проверяет общую длину и высоту, проходит ли во въезд','заходит внутрь и смотрит планировку','выбирает комплектацию и цвет'],
       seller:['покупатель из другого региона «трогает» прицеп без поездки на производство','заявка приходит с выбранной комплектацией','выделяет вас среди производителей, у которых только фотографии']},
  rv:{noun:'автодомов',buyer:['проходит внутри автодома в 3D','выбирает планировку и опции и сразу видит результат','сравнивает две комплектации'],
      seller:['продажа из других регионов без визита на производство','меньше часов менеджера на повторные показы','заявка приходит с готовой конфигурацией']},
  cargo:{noun:'прицепов и техники',buyer:['ставит лодку или технику на прицеп за своей машиной','проверяет общую длину, высоту и проходит ли во въезд','выбирает нужную модель прицепа под свой груз'],
       seller:['меньше ошибок подбора прицепа под лодку','наглядная разница между моделями','заявка сразу содержит машину и груз покупателя']},
  other:{noun:'вашей продукции',buyer:['ставит изделие на свою машину или в своё пространство в 3D','проверяет габариты и совместимость','сравнивает два варианта рядом'],
         seller:['меньше возвратов из-за неподходящего размера','товар можно показать без образца','заявки с уже выбранной конфигурацией']}
};

/* ---------- storage ---------- */
const DESK=window.desk||{ // browser fallback for previews
  load:async()=>{ try{ return JSON.parse(localStorage.getItem('leaddesk')); }catch(e){ return null; } },
  save:async d=>{ try{ localStorage.setItem('leaddesk',JSON.stringify(d)); }catch(e){} return true; },
  openExternal:async u=>window.open(u,'_blank'), openDataFolder:async()=>{}, exportJson:async()=>null, importJson:async()=>null, exportKp:async()=>null };
let DB=null, sel=null, tab='card', view='leads', saveT=0;
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toISOString();
function seed(){
  return { v:1, settings:{ myName:'', myRole:'Разработчик 3D-конфигураторов', phone:'', email:'', tg:'', demo:'https://claude.ai/artifact/LpwUUD65VEryTRS68ZQPAb',
      about:'Я делаю интерактивные 3D-конфигураторы: покупатель ставит товар на свою машину, проверяет размеры и сравнивает модели прямо в телефоне или на сайте.',
      proof:'Рабочий прототип для Haval F7: автобоксы Thule на настоящих дугах, проверка высоты под въезд паркинга, открытие двери багажника, укладка вещей, погода по геолокации. Работает на Android и в браузере.' },
    leads: window.SEED_L.map(r=>{ const [name,city,seg,prio,what,site,note]=r; const l=blank();
      Object.assign(l,{name,city:city==='—'?'':city,seg,prio,what,site});
      if(note) l.notes.push({id:uid(),t:now(),text:note,sys:false});
      if(name==='LUX'){ l.status='proposal'; l.history.push({t:now(),status:'proposal'}); }
      return l; }) };
}
function blank(){ return {id:uid(),name:'Новая компания',city:'',seg:'other',prio:'m',what:'',site:'',person:'',role:'',phone:'',email:'',tg:'',
  status:'new',next:'',nextDate:'',about:'',hooks:'',show:'',notes:[],history:[{t:now(),status:'new'}],kp:{text:'',edited:false,t:'',kind:'full'},created:now(),updated:now()}; }
async function boot(){ DB=await DESK.load(); if(!DB||!DB.leads){ DB=seed(); await DESK.save(DB); } renderFilters(); renderList(); if(!sel&&DB.leads[0]) sel=DB.leads[0].id; go(view); }
function touch(l){ if(l) l.updated=now(); clearTimeout(saveT); saveT=setTimeout(()=>DESK.save(DB),350); }
const L=id=>DB.leads.find(x=>x.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1800); }
const today=()=>new Date().toISOString().slice(0,10);
function dueClass(d){ if(!d) return ''; const t=today(); return d<t?'over':d===t?'today':''; }
function fmtD(d){ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}.${m}`; }
function fmtT(t){ const d=new Date(t); return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
const pill=s=>`<span class="pill" style="--c:var(--s-${s})">${STN[s]}</span>`;

/* ---------- list ---------- */
function renderFilters(){
  document.getElementById('fSeg').innerHTML='<option value="">Все ниши</option>'+Object.entries(SEG).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  document.getElementById('fSt').innerHTML='<option value="">Все статусы</option><option value="active">В работе</option>'+ST.map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
}
function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase(), fs=document.getElementById('fSeg').value, ft=document.getElementById('fSt').value, so=document.getElementById('fSort').value;
  let r=DB.leads.filter(l=>(!fs||l.seg===fs)&&(!ft||(ft==='active'?ACTIVE.has(l.status):l.status===ft))&&(!q||[l.name,l.city,l.what,l.about,l.hooks,l.person,...l.notes.map(n=>n.text)].join(' ').toLowerCase().includes(q)));
  const P={h:0,m:1,l:2};
  if(so==='name') r.sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  else if(so==='prio') r.sort((a,b)=>P[a.prio]-P[b.prio]||a.name.localeCompare(b.name,'ru'));
  else if(so==='recent') r.sort((a,b)=>b.updated.localeCompare(a.updated));
  else r.sort((a,b)=>(a.nextDate||'9999')<(b.nextDate||'9999')?-1:(a.nextDate||'9999')>(b.nextDate||'9999')?1:P[a.prio]-P[b.prio]);
  return r;
}

function myContacts(){ const s=DB.settings; return [s.phone,s.email,s.tg].filter(Boolean).join(' · '); }
function makeKp(l,kind){
  const s=DB.settings, p=PITCH[l.seg]||PITCH.other, hi=l.person?`Здравствуйте, ${l.person.split(' ')[0]}!`:'Здравствуйте!';
  const show=(l.show.trim()?l.show.split('\n').map(x=>x.trim()).filter(Boolean):p.buyer);
  const me=(s.myName||'[ваше имя]')+(s.myRole?', '+s.myRole.charAt(0).toLowerCase()+s.myRole.slice(1):'');
  const about=l.about.trim(), hooks=l.hooks.trim(), what=l.what.trim();
  if(kind==='short') return [hi,'',`Меня зовут ${s.myName||'[ваше имя]'}. ${s.about}`,'',
    `Посмотрел ${l.name}${what?` (${what.charAt(0).toLowerCase()+what.slice(1)})`:''} и думаю, что вашим покупателям это зайдёт: ${show[0]}${show[1]?', а ещё '+show[1]:''}.`,
    hooks?`\n${hooks}`:'', '',`Прототип можно открыть прямо сейчас: ${s.demo}`,'','Удобно показать вживую за 20 минут? Подстроюсь под ваше время.','',s.myName||'[ваше имя]',myContacts()].filter(x=>x!==null).join('\n').replace(/\n{3,}/g,'\n\n');
  if(kind==='follow') return [hi,'',`Напомню о себе: на прошлой неделе писал про 3D-конфигуратор ${p.noun} для ${l.name}.`,'',
    `Коротко: покупатель ${show[0]}. Для вас это ${p.seller[0]}.`,'',`Прототип: ${s.demo}`,'','Если тема неактуальна, просто ответьте «нет», я не буду беспокоить. Если интересно, предложите удобное время на 20 минут.','',s.myName||'[ваше имя]',myContacts()].join('\n');
  const L1=[];
  L1.push(`Коммерческое предложение для ${l.name}`,`3D-конфигуратор ${p.noun} для ваших покупателей`,'',hi,'',`Меня зовут ${me}. ${s.about}`,'');
  L1.push('Почему пишу именно вам');
  L1.push(about?about:(what?`Вы производите: ${what.charAt(0).toLowerCase()+what.slice(1)}. Это как раз тот товар, который покупатель хочет «примерить» на свою машину до покупки.`:`Ваш товар покупатель хочет «примерить» до покупки.`));
  if(hooks) L1.push('',hooks);
  L1.push('','Что получит ваш покупатель');
  show.forEach(x=>L1.push('• Покупатель '+x.replace(/^покупатель\s+/i,'')));
  L1.push('','Что это даёт вам'); p.seller.forEach(x=>L1.push('• '+x.charAt(0).toUpperCase()+x.slice(1)));
  L1.push('• Заявка приходит с данными: какая машина, какая модель, что выбрано');
  L1.push('','Как это выглядит',s.proof,s.demo?`Посмотреть: ${s.demo}`:'');
  L1.push('','Где будет работать','• Виджет на вашем сайте и в карточке товара','• Приложение для Android и iOS под вашим брендом','• Планшет в шоуруме, у дилеров и на выставках');
  L1.push('','Как предлагаю начать','1. Встреча на 30 минут: покажу прототип, разберём ваш ассортимент и машины ваших покупателей.','2. Пилот: 1–2 ваши модели на 2–3 популярных машинах.','3. Запуск и расширение линейки.');
  L1.push('','Стоимость зависит от числа моделей и платформ, назову её после встречи, когда пойму объём.');
  L1.push('',`Когда вам удобно встретиться или созвониться на этой неделе?`,'',s.myName||'[ваше имя]',myContacts()||'[контакты]');
  return L1.join('\n').replace(/\n{3,}/g,'\n\n');
}
function kpHtml(l){
  const lines=l.kp.text.split('\n'); let html='', inList=false, inOl=false;
  const heads=new Set(['Почему пишу именно вам','Что получит ваш покупатель','Что это даёт вам','Как это выглядит','Где будет работать','Как предлагаю начать']);
  lines.forEach((ln,i)=>{ const t=ln.trim();
    const isLi=t.startsWith('• '), isOl=/^\d\.\s/.test(t);
    if(!isLi&&inList){ html+='</ul>'; inList=false; } if(!isOl&&inOl){ html+='</ol>'; inOl=false; }
    if(i===0&&l.kp.kind==='full') html+=`<h1>${esc(t)}</h1>`;
    else if(i===1&&l.kp.kind==='full') html+=`<p class="sub">${esc(t)}</p>`;
    else if(heads.has(t)) html+=`<h2>${esc(t)}</h2>`;
    else if(isLi){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${esc(t.slice(2))}</li>`; }
    else if(isOl){ if(!inOl){ html+='<ol>'; inOl=true; } html+=`<li>${esc(t.replace(/^\d\.\s/,''))}</li>`; }
    else if(t) html+=`<p>${esc(t).replace(/(https?:\/\/\S+)/g,'<a href="$1">$1</a>')}</p>`; });
  if(inList) html+='</ul>'; if(inOl) html+='</ol>';
  return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>${esc(l.name)}</title><style>
    body{font-family:"Segoe UI",Arial,sans-serif;color:#17201C;font-size:11pt;line-height:1.55;max-width:170mm;margin:0 auto}
    h1{font-size:20pt;margin:0 0 2pt;color:#0E7A5F} .sub{font-size:12pt;color:#5F6C67;margin:0 0 16pt}
    h2{font-size:12pt;margin:16pt 0 4pt;color:#0E7A5F;border-bottom:1px solid #D9E0DD;padding-bottom:3pt}
    p{margin:0 0 6pt} ul,ol{margin:0 0 6pt;padding-left:18pt} li{margin:0 0 3pt} a{color:#0E7A5F}
  </style></head><body>${html}</body></html>`;
}

function renderStrategy(){
  const A=DB.leads, act=A.filter(l=>ACTIVE.has(l.status)), t=today();
  const over=A.filter(l=>l.nextDate&&l.nextDate<t&&l.status!=='won'&&l.status!=='lost');
  const todayL=A.filter(l=>l.nextDate===t);
  const noNext=act.filter(l=>!l.next&&!l.nextDate);
  const stale=A.filter(l=>['contacted','proposal'].includes(l.status)&&daysSince(lastStatusT(l))>=7);
  const max=Math.max(1,...ST.map(([k])=>A.filter(l=>l.status===k).length));
  const segRows=Object.keys(SEG).map(k=>{ const g=A.filter(l=>l.seg===k); return {k,n:g.length,c:g.filter(l=>STI[l.status]>=STI.contacted&&l.status!=='lost').length,m:g.filter(l=>STI[l.status]>=STI.meeting&&l.status!=='lost').length,w:g.filter(l=>l.status==='won').length,h:g.filter(l=>l.prio==='h'&&l.status==='new').length}; }).filter(r=>r.n);
  const tips=[];
  over.forEach(l=>tips.push({w:`<b>Просрочен шаг:</b> ${esc(l.name)} — ${esc(l.next||'без описания')} (${fmtD(l.nextDate)})`,id:l.id}));
  stale.forEach(l=>tips.push({w:`<b>Нет ответа ${daysSince(lastStatusT(l))} дн.:</b> ${esc(l.name)} — отправьте напоминание (КП → «Напоминание»)`,id:l.id}));
  noNext.forEach(l=>tips.push({w:`<b>Нет следующего шага:</b> ${esc(l.name)} в статусе «${STN[l.status]}»`,id:l.id}));
  segRows.filter(r=>r.c===0&&r.h>0).forEach(r=>{ const first=A.find(l=>l.seg===r.k&&l.prio==='h'&&l.status==='new'); tips.push({w:`<b>${SEG[r.k]}:</b> ни с кем не связывались, высокий приоритет у ${r.h}. Начните с ${esc(first.name)}`,id:first.id}); });
  const won=A.filter(l=>l.status==='won'), meet=A.filter(l=>STI[l.status]>=STI.meeting&&l.status!=='lost');
  if(won.length){ const seg=won[0].seg; const sim=A.filter(l=>l.seg===seg&&l.status==='new'); if(sim.length) tips.push({w:`<b>Есть сделка в нише «${SEG[seg]}»:</b> предложите тот же кейс ещё ${sim.length} компаниям этой ниши`,id:sim[0].id}); }
  document.getElementById('main').innerHTML=`<div class="view">
    <h1>План и стратегия</h1>
    <div class="kpi"><div><b>${act.length}</b><span>в работе</span></div><div><b>${meet.length}</b><span>дошли до встречи</span></div><div><b>${won.length}</b><span>сделок</span></div><div><b style="color:${over.length?'var(--bad)':'inherit'}">${over.length}</b><span>просроченных шагов</span></div></div>
    <div class="grid2">
      <div class="box"><h2>Что сделать</h2>${tips.length?`<ul class="tips">${tips.slice(0,12).map(x=>`<li><span>${x.w}</span><button class="btn go" data-open="${x.id}">Открыть</button></li>`).join('')}</ul>`:'<div class="empty">Всё по плану</div>'}</div>
      <div class="box"><h2>Сегодня</h2>${todayL.length?`<div class="duel">${todayL.map(l=>`<button data-open="${l.id}"><span><b>${esc(l.name)}</b><br><span class="hint">${esc(l.next||'')}</span></span>${pill(l.status)}</button>`).join('')}</div>`:'<div class="empty">На сегодня шагов нет</div>'}</div>
    </div>
    <div class="box"><h2>Воронка</h2><div class="funnel">${ST.map(([k,v])=>{ const n=A.filter(l=>l.status===k).length; return `<div class="frow2"><span>${v}</span><span class="bar"><i style="width:${n/max*100}%;--c:var(--s-${k})"></i></span><span class="v">${n}</span></div>`; }).join('')}</div></div>
    <div class="box"><h2>По нишам</h2><div style="overflow:auto"><table><thead><tr><th>Ниша</th><th class="num">Всего</th><th class="num">Связался</th><th class="num">Встречи</th><th class="num">Сделки</th><th class="num">Новых с высоким</th></tr></thead><tbody>
      ${segRows.map(r=>`<tr><td>${SEG[r.k]}</td><td class="num">${r.n}</td><td class="num">${r.c}</td><td class="num">${r.m}</td><td class="num">${r.w}</td><td class="num">${r.h}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="box"><h2>Мои заметки по стратегии</h2><label class="f"><textarea id="stratNotes" style="min-height:140px" placeholder="Гипотезы, выводы после встреч, что лучше заходит в какой нише">${esc(DB.settings.strategy||'')}</textarea></label></div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.nav) return go(t.dataset.nav);
  if(t.classList.contains('it')){ sel=t.dataset.id; tab=tab||'card'; return go('leads'); }
  if(t.dataset.open){ sel=t.dataset.open; tab='card'; return go('leads'); }
  if(t.dataset.ext) return DESK.openExternal(t.dataset.ext);
  if(t.dataset.tab){ tab=t.dataset.tab; return renderLead(); }
  const l=L(sel);
  if(t.dataset.st&&l){ if(l.status!==t.dataset.st){ const from=l.status; l.status=t.dataset.st; l.history.push({t:now(),status:l.status}); l.notes.push({id:uid(),t:now(),text:`Статус: ${STN[from]} → ${STN[l.status]}`,sys:true}); touch(l); renderLead(); renderList(); } return; }
  if(t.id==='addBtn'){ const n=blank(); DB.leads.unshift(n); sel=n.id; tab='card'; touch(n); go('leads'); setTimeout(()=>{ const f=document.getElementById('f-name'); f&&f.select(); },0); return; }
  if(t.id==='delBtn'){ document.getElementById('delWrap').innerHTML=`<span class="hint">Удалить ${esc(l.name)} со всеми заметками?</span><button class="btn danger" id="delYes">Удалить</button><button class="btn" id="delNo">Отмена</button>`; return; }
  if(t.id==='delNo') return renderLead();
  if(t.id==='delYes'){ DB.leads=DB.leads.filter(x=>x.id!==sel); sel=(DB.leads[0]||{}).id; touch(); go('leads'); toast('Компания удалена'); return; }
  if(t.id==='nAdd'){ const v=document.getElementById('nText').value.trim(); if(!v) return; l.notes.push({id:uid(),t:now(),text:v,sys:false}); touch(l); renderLead(); return; }
  if(t.dataset.ndel){ l.notes=l.notes.filter(n=>n.id!==t.dataset.ndel); touch(l); renderLead(); return; }
  if(t.id==='kpGen'){ l.kp.text=makeKp(l,l.kp.kind); l.kp.edited=false; l.kp.t=now(); touch(l); renderTab(); toast('КП собрано заново'); return; }
  if(t.id==='kpCopy'){ try{ await navigator.clipboard.writeText(l.kp.text); toast('Скопировано'); }catch(_){ document.getElementById('kpText').select(); } return; }
  if(t.id==='kpPdf'||t.id==='kpDoc'){ const name=(l.kp.kind==='full'?'КП ':'Письмо ')+l.name.replace(/[\\/:*?"<>|«»]/g,''); const p=await DESK.exportKp({html:kpHtml(l),name,kind:t.id==='kpPdf'?'pdf':'doc'}); if(p){ l.notes.push({id:uid(),t:now(),text:`Сохранено: ${p}`,sys:true}); touch(l); toast('Сохранено'); } return; }
  if(t.id==='kpSent'){ if(l.status!=='proposal'){ const from=l.status; l.status='proposal'; l.history.push({t:now(),status:'proposal'}); l.notes.push({id:uid(),t:now(),text:`Статус: ${STN[from]} → КП отправлено`,sys:true}); }
    if(!l.nextDate){ const d=new Date(Date.now()+5*864e5).toISOString().slice(0,10); l.nextDate=d; l.next='Напомнить про КП'; }
    touch(l); renderList(); toast('Отмечено, напоминание через 5 дней'); return; }
  if(t.id==='exp'){ const p=await DESK.exportJson(DB); if(p) toast('Копия сохранена'); return; }
  if(t.id==='imp'){ const d=await DESK.importJson(); if(d&&d.leads){ DB=d; sel=(DB.leads[0]||{}).id; touch(); go('settings'); toast(`Загружено компаний: ${DB.leads.length}`); } return; }
  if(t.id==='fold') return DESK.openDataFolder();
});
document.addEventListener('input',e=>{ const el=e.target, id=el.id||'';
  if(['q'].includes(id)) return renderList();
  if(id.startsWith('f-')){ const l=L(sel); l[id.slice(2)]=el.value; touch(l); if(['f-name','f-city','f-seg','f-prio','f-nextDate'].includes(id)) renderList(); if(id==='f-seg'){ const sh=document.getElementById('f-show'); if(sh) sh.placeholder=PITCH[el.value].buyer.join('\n'); } return; }
  if(id==='kpText'){ const l=L(sel); l.kp.text=el.value; l.kp.edited=true; touch(l); document.getElementById('kpFlag').textContent='Текст правился вручную: «Собрать заново» заменит правки'; return; }
  if(id.startsWith('s-')){ DB.settings[id.slice(2)]=el.value; touch(); return; }
  if(id==='stratNotes'){ DB.settings.strategy=el.value; touch(); }
});
document.addEventListener('change',e=>{ const id=e.target.id;
  if(id==='fSeg'||id==='fSt'||id==='fSort') renderList();
  if(id==='kpKind'){ const l=L(sel); l.kp.kind=e.target.value; l.kp.text=makeKp(l,l.kp.kind); l.kp.edited=false; touch(l); renderTab(); }
  if(id==='f-seg'||id==='f-prio') renderLead();
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='nText'){ document.getElementById('nAdd').click(); } });
boot();
</script>
</body>
