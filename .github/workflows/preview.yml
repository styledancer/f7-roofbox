name: Preview screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core@1.47.2
          mkdir -p www/vendor
          cp node_modules/three/build/three.min.js www/vendor/
          cp node_modules/three/examples/js/controls/OrbitControls.js www/vendor/
          cp node_modules/three/examples/js/loaders/GLTFLoader.js www/vendor/
      - name: Screenshots
        run: |
          (cd www && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2; mkdir -p shots
          node tools/shot.mjs http://127.0.0.1:8080/index.html shots || true
          ls -la shots
          cd shots && zip -q ../shots.zip *
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view preview >/dev/null 2>&1 || gh release create preview --prerelease --title "Скриншоты для проверки" --notes "Служебные скриншоты"
          gh release upload preview shots.zip --clobber
