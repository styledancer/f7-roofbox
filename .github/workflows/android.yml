name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK (preinstalled on the runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Copy three.js into the app
        run: |
          mkdir -p www/vendor
          cp node_modules/three/build/three.min.js www/vendor/
          cp node_modules/three/examples/js/controls/OrbitControls.js www/vendor/
          cp node_modules/three/examples/js/loaders/GLTFLoader.js www/vendor/
      - name: Bake the Cloudflare key into the app (from repository secrets)
        env:
          CF_TOK: ${{ secrets.CF_TOKEN }}
          CF_ACC: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os
          p='www/index.html'; s=open(p,encoding='utf-8').read()
          tok=os.environ.get('CF_TOK','').strip(); acc=os.environ.get('CF_ACC','').strip()
          if tok: s=s.replace("tok:'__CF_TOK__'","tok:'"+tok+"'")
          if acc: s=s.replace("acc:'__CF_ACC__'","acc:'"+acc+"'")
          open(p,'w',encoding='utf-8').write(s)
          print('token baked:', bool(tok), 'account baked:', bool(acc))
          PY
      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Allow location (weather for where the phone is)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'; s=open(p).read()
          add='<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
          if 'ACCESS_COARSE_LOCATION' not in s: s=s.replace('<application', add+'    <application',1)
          open(p,'w').write(s); print('location permission added')
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk f7-roofbox-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: f7-roofbox-apk
          path: f7-roofbox-*.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестовая сборка ${{ github.run_number }}
          files: f7-roofbox-*.apk
