name: Build LeadDesk (Windows)
on:
  push:
    branches: [crm]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Rename
        shell: bash
        run: cp dist/LeadDesk-*.exe LeadDesk-${{ github.run_number }}.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: crm-${{ github.run_number }}
          name: LeadDesk ${{ github.run_number }}
          files: LeadDesk-*.exe
