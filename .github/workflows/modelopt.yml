name: Optimise models
on:
  push:
    branches: [modelopt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  opt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund @gltf-transform/core@4.1.1 @gltf-transform/functions@4.1.1 @gltf-transform/extensions@4.1.1 meshoptimizer@0.22.0
      - run: mkdir -p out && (node tools/opt.mjs 2>&1 | tee out/log.txt); cd out && zip -q -r ../models-opt.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: modelopt-${{ github.run_number }}
          name: Models optimised ${{ github.run_number }}
          prerelease: true
          files: models-opt.zip
